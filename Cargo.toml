[package]
name = "dlrs"
version = "0.1.0"
edition = "2024"

[dependencies]
colored = "3.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }

[[bin]]
name = "dlrs"
path = "src/main.rs"